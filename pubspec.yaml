name: saveduk
description: "Social media video downloader — share a link, auto-download to gallery."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP & downloading
  dio: ^5.7.0

  # Save to device gallery
  gal: ^2.3.0

  # File system paths
  path_provider: ^2.1.5
  path: ^1.9.1

  # Local Android MP4 remuxing; maintained FFmpegKit fork, version pinned.
  ffmpeg_kit_flutter_new_min: 3.5.5

  # Local database
  sqflite: ^2.4.1

  # Date formatting
  intl: ^0.20.2

  # Typography
  google_fonts: ^6.2.1

  # Share files out
  share_plus: ^10.1.4

  # Open files with system player
  open_file: ^3.5.10

  # Unique IDs
  uuid: ^4.5.1

  # Video thumbnails
  video_thumbnail: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.jpg


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.jpg"
